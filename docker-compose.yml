# Start everything with: docker compose up --build
# All settings come from .env (see .env.example).

x-app: &app
  build: .
  image: voice-assistant:latest
  env_file: .env
  restart: unless-stopped

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: applies migrations and seeds the owner, then exits.
  migrate:
    <<: *app
    restart: "no"
    # Also creates the dashboard's read-only role and seeds the demo data once (skipped when present).
    command: ["sh", "-c", "alembic upgrade head && python -m app.db.seed && python -m app.db.readonly_role && python -m app.db.demo"]
    depends_on:
      db:
        condition: service_healthy

  bot:
    <<: *app
    command: ["python", "-m", "app.bot"]
    volumes:
      - voice_data:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    <<: *app
    command: ["uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Token and quality dashboard (read-only DB role). Locally http://127.0.0.1:8080;
  # in production the "proxy" service serves it on DASHBOARD_HOST with HTTPS.
  dashboard:
    <<: *app
    command: ["uvicorn", "app.dashboard.main:app", "--host", "0.0.0.0", "--port", "8080",
              "--proxy-headers", "--forwarded-allow-ips", "*"]
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Production only: HTTPS reverse proxy for the dashboard on DASHBOARD_HOST.
  #   docker compose --profile proxy up -d
  proxy:
    image: caddy:2.8.4-alpine
    profiles: ["proxy"]
    restart: unless-stopped
    environment:
      DASHBOARD_HOST: ${DASHBOARD_HOST:-}  # must be set before starting the proxy profile
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - dashboard

  # MCP server over stdio, started by an MCP client (see README); not part of `docker compose up`.
  #   docker compose run --rm -i --no-deps mcp
  mcp:
    <<: *app
    profiles: ["mcp"]
    restart: "no"
    stdin_open: true
    command: ["python", "-m", "app.mcp"]

volumes:
  pgdata:
  voice_data:
  caddy_data:
  caddy_config:
